name: Update Czech pickup directory
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17,23 * * *'
permissions:
  contents: read
concurrency:
  group: pickup-directory
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/sync-pickups.mjs
        env:
          WEBSITE_URL: https://dianetika-brno-jizni.centrum-dianetiky-brno.workers.dev
          PICKUP_SYNC_SECRET: ${{ secrets.PICKUP_SYNC_SECRET }}
